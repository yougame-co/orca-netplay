# Orca launcher profile: Project+ v3.2 (Project+ Development Team) on Super Smash Bros. Brawl
# (NTSC-U) revision 2, selected with ORCA_PROFILE=PPLUS32. Orca ships none of Project+'s files: the
# player downloads the official v3.2 Netplay release (linked from projectplusgame.com), and the app
# puts its launcher and SD card image in one folder. The hashes below pin those files. Settings
# every session forces live in Source/Core/Core/Orca/Profile.cpp.

[Profile]
# The window title's name for the game.
Title = Project+
# The disc the launcher boots.
Disc = RSBE01
Revision = 2
# XXH3-128 of user/Launcher/Project+ Netplay Launcher.dol (SHA-256 74a0decf...c0da).
Launcher = 1e45a9a7ce1b8837020d15bc1379c21e
# user/Wii/sd.raw (2,097,152,000 bytes; SHA-256 cfe5d869...2d2d), next to the launcher.
SDImage = sd.raw
SDImageHash = 5293a846d4de6139fd3ccd61faa9ac8d
# Seed the session NAND with Brawl's save (the launcher itself is title 0).
SaveTitle = 0x0001000052534245
# Brawl's frame loop: Project+'s codes leave it where vanilla has it.
FrameHook = 0x80017504
FrameHookWord = 0x90170100
# Drop-in: the boot's NAND /tmp files are identical on every machine by this frame, so a joining
# player rebuilds them by booting here instead of downloading them.
BootNandFrame = 600
# Project+ rewrites these words of already-compiled Brawl code in frame 1. A JIT clear at a
# different moment on each machine would pick up the new words on one side only and desync, so
# instruction fetches here always return Brawl's word while RAM holds Project+'s.
# See ORCA.md, "Code the JIT doesn't see". <address> <Brawl's word> <Project+'s word>:
KeepGameCode = 0x8001CD24 0x38631198 0x806311A0   # Fixed OSReport Syntax on File Reading
KeepGameCode = 0x8001CD2C 0x80630008 0x38630006
KeepGameCode = 0x800266B8 0x38672CAC 0x38672CB2
KeepGameCode = 0x8018CFC4 0x2C000000 0x28000030   # [Legacy TE] Extra null pointer catch
KeepGameCode = 0x8018CFC8 0x41820034 0x41800034
# Project+'s "Move v-sync call" (0x80023B88, 0x80024028) is not kept: PPLUS32.patches writes its
# words at the first boundary, so every machine runs it from frame 1.
# Clear the JIT once after the codes land, so every machine compiles the same code from here on.
JitClearFrame = 2

[Forced]
# The card holds the codeset and every Project+ asset; the session opens it read-only.
Dolphin.Core.WiiSDCard = True
# Pin the clock to 2025-01-01: at the console epoch (2000-01-01) Brawl never detects a GameCube
# controller after the launcher boots it. Cause not traced.
Dolphin.Core.CustomRTCValue = 1735689600
