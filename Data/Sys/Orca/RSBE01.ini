# Orca profile: Super Smash Bros. Brawl (NTSC-U). Settings every session forces live in
# Source/Core/Core/Orca/Profile.cpp; [Forced] adds Brawl-only ones as <System>.<Section>.<Key> =
# <Value> (the -C syntax). A malformed line refuses the session.

[Profile]
Revision = 2
# End of Brawl's frame loop, used as the frame boundary until Orca has a game-agnostic one.
FrameHook = 0x80017504
# The instruction expected there (stw r0,0x100(r23)); a mismatch means a different game build.
FrameHookWord = 0x90170100
# Drop-in: the boot's 37 MB of NAND /tmp files are identical on every machine by this frame, so a
# joining player rebuilds them by booting here instead of downloading them.
BootNandFrame = 1800

[Forced]
