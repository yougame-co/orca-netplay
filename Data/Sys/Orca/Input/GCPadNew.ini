# Orca's default port 1 controller: the keyboard (Dolphin's default keys) plus the first SDL
# gamepad. Copied to <user dir>/Config/GCPadNew.ini when missing; edit that copy to remap.
[GCPad1]
Device = Quartz/0/Keyboard & Mouse
Buttons/A = `X` | `SDL/0/*:Button S`
Buttons/B = `Z` | `SDL/0/*:Button W`
Buttons/X = `C` | `SDL/0/*:Button E`
Buttons/Y = `S` | `SDL/0/*:Button N`
Buttons/Z = `D` | `SDL/0/*:Shoulder R`
Buttons/Start = `Return` | `SDL/0/*:Start`
Main Stick/Up = `Up Arrow` | `SDL/0/*:Left Y+`
Main Stick/Down = `Down Arrow` | `SDL/0/*:Left Y-`
Main Stick/Left = `Left Arrow` | `SDL/0/*:Left X-`
Main Stick/Right = `Right Arrow` | `SDL/0/*:Left X+`
Main Stick/Modifier = `Shift`
C-Stick/Up = `I` | `SDL/0/*:Right Y+`
C-Stick/Down = `K` | `SDL/0/*:Right Y-`
C-Stick/Left = `J` | `SDL/0/*:Right X-`
C-Stick/Right = `L` | `SDL/0/*:Right X+`
C-Stick/Modifier = `Ctrl`
Triggers/L = `Q` | `SDL/0/*:Trigger L`
Triggers/R = `W` | `SDL/0/*:Trigger R`
Triggers/L-Analog = `SDL/0/*:Trigger L`
Triggers/R-Analog = `SDL/0/*:Trigger R`
D-Pad/Up = `T` | `SDL/0/*:Pad N`
D-Pad/Down = `G` | `SDL/0/*:Pad S`
D-Pad/Left = `F` | `SDL/0/*:Pad W`
D-Pad/Right = `H` | `SDL/0/*:Pad E`
